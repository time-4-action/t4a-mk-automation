# check -> deploy -> verify.
#
# Checks every pull request and every push. A green check on `dev` or `main`
# builds the image, pushes it to GHCR and rolls that branch's server onto that
# exact SHA over SSH, rolling back to the previous image if it does not come up
# healthy on that commit. `verify` then checks the public URL.
#
#   dev  -> development env, DEV_DEPLOY_* secrets,  :dev-<sha> + :dev,  mkauto.dev.time-4-action.com
#   main -> production env,  PROD_DEPLOY_* secrets, :<sha> + :latest,   mkauto.time-4-action.com
#
# The VMs only pull; see docs/deployment.md.
name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. On main
# runs are never cancelled, only queued, so an older commit can never be
# deployed over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/time-4-action/t4a-mk-automation
  # Everything below differs per branch: main is production, anything else (only dev
  # reaches the deploy job) is development.
  # Image tag; dev ones are prefixed so a dev build can never be mistaken for a release.
  TAG: ${{ github.ref_name == 'main' && github.sha || format('dev-{0}', github.sha) }}
  # Moving tag the server's compose file falls back to.
  CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
  # Host port the server's compose publishes on loopback, for the health check below.
  # The dev VM hosts several apps, so each gets its own (see deploy/docker-compose.dev.yml).
  HOST_PORT: ${{ github.ref_name == 'main' && '3000' || '13010' }}
  # Overridable with the PRODUCTION_URL / DEV_URL repository variables.
  PUBLIC_URL: ${{ github.ref_name == 'main' && (vars.PRODUCTION_URL || 'https://mkauto.time-4-action.com') || (vars.DEV_URL || 'https://mkauto.dev.time-4-action.com') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      # ESLint (eslint.config.js): syntax errors, undefined names, unused and
      # unreachable code, in the server and the public/ scripts. There is no
      # test suite yet, so this is what fails a broken change before the VM does.
      - run: npm run lint
      # The same build the deploy runs, so a broken Dockerfile or a native
      # module that no longer installs fails the pull request, not the deploy.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  deploy:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    # The *_DEPLOY_* SSH secrets are organization secrets. GHCR needs none:
    # the job's own GITHUB_TOKEN pushes the image and lets the VM pull it.
    # Each environment only accepts its own branch (repository settings).
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # The `main && PROD || DEV` picks below would fall through to the dev server if the
      # production secret were empty; fail loudly instead.
      - name: Check deploy secrets
        env:
          HOST: ${{ github.ref_name == 'main' && secrets.PROD_DEPLOY_HOST || '' }}${{ github.ref_name != 'main' && secrets.DEV_DEPLOY_HOST || '' }}
        run: |
          [ -n "$HOST" ] || { echo "::error::deploy host secret for ${{ github.ref_name }} is empty or not shared with this repository"; exit 1; }

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          # Baked in as APP_VERSION, which the server checks after rollout.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}
          # The SSH login on the VM; override with the DEPLOY_USER variable.
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}
          fingerprint: ${{ github.ref_name == 'main' && secrets.PROD_DEPLOY_FINGERPRINT || secrets.DEV_DEPLOY_FINGERPRINT }}
          timeout: 30s
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -u
            cd /data/stack/apps/time-4-action/mk-automation || exit 1
            SHA=${{ github.sha }}
            NEW=${{ env.IMAGE }}:${{ env.TAG }}
            SVC=t4a-mk-automation

            # The image the service runs now is what a failed deploy goes back to.
            PREV=""
            CID=$(docker compose ps -q $SVC 2>/dev/null || true)
            if [ -n "$CID" ]; then
              PREV=$(docker inspect --format '{{.Config.Image}}' "$CID")
            fi
            echo "running: ${PREV:-nothing}  deploying: $NEW"

            healthy() {
              for i in $(seq 1 30); do
                curl -fsS http://127.0.0.1:${{ env.HOST_PORT }}/healthz >/dev/null && return 0
                sleep 2
              done
              return 1
            }

            # Healthy is not enough: the container must be running the image
            # built from this commit, not one left over.
            on_commit() {
              RUNNING=$(docker compose exec -T $SVC printenv APP_VERSION 2>/dev/null || true)
              echo "$SVC reports APP_VERSION=${RUNNING:-none}"
              [ "$RUNNING" = "$SHA" ]
            }

            # The pull logs in with this job's GITHUB_TOKEN, which expires when
            # the job ends, and logs out again on every exit: the VM keeps no
            # registry credential. Rollback needs none, the previous image is local.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null || exit 1

            export APP_IMAGE=$NEW
            # A failed pull changes nothing on the server. Retried, because
            # registries have transient failures.
            for i in 1 2 3; do
              docker compose pull $SVC && break
              [ "$i" = 3 ] && exit 1
              echo "pull failed, retrying"; sleep 10
            done

            if docker compose up -d --remove-orphans $SVC && healthy && on_commit; then
              echo "healthy on $NEW"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi

            echo "deploy of $NEW failed"
            docker compose logs --tail=50 $SVC

            if [ -z "$PREV" ] || [ "$PREV" = "$NEW" ]; then
              echo "no previous image to roll back to"
              exit 1
            fi

            echo "rolling back to $PREV"
            export APP_IMAGE=$PREV
            if docker compose up -d $SVC && healthy; then
              echo "rolled back to $PREV"
            else
              echo "rollback is not healthy either"
              docker compose logs --tail=50 $SVC
            fi
            exit 1

  # From outside: DNS, TLS and the host nginx in front of the container the
  # deploy job already checked on loopback.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public health check
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 \
            "$PUBLIC_URL/healthz"
